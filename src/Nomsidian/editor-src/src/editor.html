<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; }
  #editor { height: 100%; }
  #media-viewer {
    display: none;
    height: 100%;
    align-items: center;
    justify-content: center;
    background: #1e1e1e;
  }
  #media-image { display: none; max-width: 100%; max-height: 100%; object-fit: contain; }
  #media-pdf { display: none; width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<div id="editor"></div>
<div id="media-viewer">
  <img id="media-image" alt="" />
  <iframe id="media-pdf" title="PDFビューア"></iframe>
</div>
<script src="bundle.js"></script>
</body>
</html>
